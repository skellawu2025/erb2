{% extends "index.html" %}

{% block title %}Students Home{% endblock %}


{% block content %}Students Home Content

<form method="post" action={% url "student_delete" %}>
    {% csrf_token %}  <!-- This is mandatory -->
    <input type="text" name="name" placeholder="Student name">
    <button type="submit">Delete Student</button>
</form>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

{% endblock %}
